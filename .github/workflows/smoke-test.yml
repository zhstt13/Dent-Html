name: Dent-Html Release Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  release-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static smoke test
        run: node tests/static-smoke.mjs

      - name: Release integrity test
        run: node tests/release-integrity.test.mjs

      - name: Session 5 standalone page smoke test
        run: node tests/session5-page-smoke.mjs
